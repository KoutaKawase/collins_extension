<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Collins Hover 設定</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>main{max-width:420px;padding:16px}</style>
</head>
<body>
<main class="container">
<h3>ホバーウィンドウ設定</h3>
<fieldset>
<label>幅 px <input id="width" type="number" min="200" max="1200" step="10"></label>
<label>高さ px <input id="height" type="number" min="200" max="1000" step="10"></label>
<label>表示位置 X (left, 空=自動) <input id="left" type="number" placeholder="auto"></label>
<label>表示位置 Y (top, 空=自動) <input id="top" type="number" placeholder="auto"></label>
<label><input id="reuse" type="checkbox" role="switch"> 同じウィンドウを再利用する</label>
</fieldset>
<button id="save">保存</button> <small id="status"></small>
</main>
<script src="options.js"></script>
</body></html>
