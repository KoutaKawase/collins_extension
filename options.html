<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Collins Hover 設定</title>
<style>body{font-family:sans-serif;width:280px;padding:12px;font-size:13px}label{display:block;margin:8px 0}input{width:80px}button{margin-top:8px}#status{color:green}</style>
</head>
<body>
<h3>ホバーウィンドウ設定</h3>
<label>幅 px <input id="width" type="number" min="200" max="1200" step="10"></label>
<label>高さ px <input id="height" type="number" min="200" max="1000" step="10"></label>
<label>表示位置 X (left, 空=自動) <input id="left" type="number" placeholder="auto"></label>
<label>表示位置 Y (top, 空=自動) <input id="top" type="number" placeholder="auto"></label>
<label>離脱後すぐ閉じるまでの遅延 ms <input id="closeDelay" type="number" min="0" max="5000" step="100"></label>
<label><input id="reuse" type="checkbox"> 同じウィンドウを再利用する</label>
<button id="save">保存</button> <span id="status"></span>
<script src="options.js"></script>
</body></html>
